services:
  api:
    build:
      context: ./backend
    command: uv run --frozen --no-dev uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      MEDIA_ROOT: /media_root
      API_TOKEN: ${API_TOKEN:?API_TOKEN is required}
      DATABASE_PATH: /data/mediavault.sqlite3
      SQLITE_BUSY_TIMEOUT_MS: ${SQLITE_BUSY_TIMEOUT_MS:-5000}
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-300}
      LUT_PATH: ${LUT_PATH:-/app/assets/lut/rec709.cube}
      USER_LUT_ROOT: ${USER_LUT_ROOT:-}
    volumes:
      - ${MEDIA_ROOT_HOST_PATH:-/private/tmp/mediavault-media}:/media_root
      - ${USER_LUT_ROOT_HOST_PATH:-/private/tmp/mediavault-user-luts}:/user_luts:ro
      - backend-db:/data

  worker:
    build:
      context: ./backend
    command: uv run --frozen --no-dev python -m app.workers.worker
    restart: unless-stopped
    environment:
      MEDIA_ROOT: /media_root
      API_TOKEN: ${API_TOKEN:?API_TOKEN is required}
      DATABASE_PATH: /data/mediavault.sqlite3
      SQLITE_BUSY_TIMEOUT_MS: ${SQLITE_BUSY_TIMEOUT_MS:-5000}
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-300}
      LUT_PATH: ${LUT_PATH:-/app/assets/lut/rec709.cube}
      USER_LUT_ROOT: ${USER_LUT_ROOT:-}
    volumes:
      - ${MEDIA_ROOT_HOST_PATH:-/private/tmp/mediavault-media}:/media_root
      - ${USER_LUT_ROOT_HOST_PATH:-/private/tmp/mediavault-user-luts}:/user_luts:ro
      - backend-db:/data

  detector-certifier:
    profiles:
      - detector-certification
    build:
      context: ./backend
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m

  phase2b-migrator:
    profiles:
      - phase2b-migration
    build:
      context: ./backend
    command:
      - uv
      - run
      - --frozen
      - --no-dev
      - python
      - scripts/migrate_phase2b_formal_preview.py
      - --apply
      - --offline-maintenance-confirmed
    environment:
      API_TOKEN: migration-not-exposed
      DATABASE_PATH: /data/mediavault.sqlite3
      MEDIA_ROOT: /unmounted-media
      USER_LUT_ROOT: ""
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    volumes:
      - backend-db:/data

volumes:
  backend-db:
